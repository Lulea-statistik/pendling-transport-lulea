name: Inspect Trafikanalys injury query

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/inspect_trafa_injury_query.py"
      - ".github/workflows/inspect-trafa-injury-query.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/inspect_trafa_injury_query.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trafa_injury_query_structures.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Inspect road injury query structure"; git push; fi
