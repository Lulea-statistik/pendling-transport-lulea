name: Inspect Lulea collective map

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/inspect_lulea_collective_map.py"
      - ".github/workflows/inspect-lulea-collective-map.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect map layer
        run: python scripts/inspect_lulea_collective_map.py
      - name: Commit inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lulea_collective_map_inspect.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Inspect Lulea collective transport map layer"
            git pull --rebase origin main
            git push
          fi
