name: Inspect Trafikanalys tables

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/inspect_trafa.py"
      - ".github/workflows/inspect-trafa.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Inspect Trafikanalys workbooks
        run: python scripts/inspect_trafa.py
      - name: Commit inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trafa_inspect.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Inspect Trafikanalys workbook structure"
            git push
          fi
