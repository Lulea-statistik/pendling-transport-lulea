name: Inspect NVDB statistics

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/inspect_nvdb.py"
      - ".github/workflows/inspect-nvdb.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Inspect NVDB municipal statistics
        run: python scripts/inspect_nvdb.py
      - name: Commit inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nvdb_inspect.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Inspect NVDB municipal statistics"
            git push
          fi
