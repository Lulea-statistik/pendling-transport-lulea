name: Inspect Lulea collective layers

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/inspect_lulea_collective_layers.py"
      - ".github/workflows/inspect-lulea-collective-layers.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect ArcGIS layers
        run: python scripts/inspect_lulea_collective_layers.py
      - name: Commit inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lulea_collective_layers.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Inspect Lulea collective transport layers"
            git pull --rebase origin main
            git push
          fi
