name: Update road injury data

on:
  workflow_dispatch:
  schedule:
    - cron: "27 6 * * 1"
  push:
    paths:
      - "scripts/fetch_injury_data.py"
      - ".github/workflows/update-injury-data.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Trafikanalys road injury data
        run: python scripts/fetch_injury_data.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/injuries.json docs/data/injuries.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update municipal road injury data"
            git push
          fi
