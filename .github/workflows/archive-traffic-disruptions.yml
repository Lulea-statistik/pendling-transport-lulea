name: Archive traffic disruptions

on:
  workflow_dispatch:
  schedule:
    - cron: "40 5 * * *"
  push:
    paths:
      - "scripts/archive_ltn_traffic_info.py"
      - ".github/workflows/archive-traffic-disruptions.yml"

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - name: Archive current traffic information
        run: python scripts/archive_ltn_traffic_info.py
      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/traffic_disruptions.json data/traffic_disruptions.csv docs/data/traffic_disruptions.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Archive Lanstrafiken traffic information"
            git pull --rebase origin main
            git push
          fi
