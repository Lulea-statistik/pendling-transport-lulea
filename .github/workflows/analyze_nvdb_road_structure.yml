name: Analyze NVDB road structure
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build_nvdb_road_structure.py
      - .github/workflows/analyze_nvdb_road_structure.yml
permissions:
  contents: write
concurrency:
  group: nvdb-road-structure
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install geometry tools
        run: python3 -m pip install requests shapely pyproj
      - name: Compute road class, maintainer and network lengths
        env:
          LASTKAJEN_USERNAME: ${{ secrets.LASTKAJEN_USERNAME }}
          LASTKAJEN_PASSWORD: ${{ secrets.LASTKAJEN_PASSWORD }}
        run: python3 scripts/build_nvdb_road_structure.py
      - name: Upload QA metrics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nvdb-road-structure-qa
          path: nvdb_output/nvdb_road_structure_qa.json
          retention-days: 7
      - name: Publish run pointer
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_REPO: ${{ github.repository }}
          RUN_POINTER_PATH: docs/data/nvdb-road-structure-status.json
          RUN_WORKFLOW_NAME: Analyze NVDB road structure
        run: python3 scripts/publish_nvdb_run_status.py
