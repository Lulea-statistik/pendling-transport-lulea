name: Update freight registered trucks
on:
  workflow_dispatch:
  schedule:
    - cron: '11 8 23 * *'
  push:
    paths:
      - scripts/fetch_freight_truck_stock.py
      - .github/workflows/update_freight_truck_stock.yml
permissions:
  contents: write
concurrency:
  group: freight-truck-stock
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch validated SCB truck stock
        run: python3 scripts/fetch_freight_truck_stock.py
      - name: Archive validated source data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: freight-truck-stock
          path: docs/data/freight-truck-stock.json
      - name: Publish data using current GitHub contents SHA
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,urllib.error
          path="docs/data/freight-truck-stock.json"
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/{path}"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"}
          content=open(path,"rb").read()
          for attempt in range(4):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:sha=json.load(r)["sha"]
              except urllib.error.HTTPError as e:
                  if e.code!=404:raise
                  sha=None
              body={"message":"Update SCB registered truck statistics","content":base64.b64encode(content).decode()}
              if sha:body["sha"]=sha
              req=urllib.request.Request(url,headers={**headers,"Content-Type":"application/json"},data=json.dumps(body).encode(),method="PUT")
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:print("Published",r.status)
                  break
              except urllib.error.HTTPError as e:
                  if e.code not in (409,422) or attempt==3:raise
          PY
      - name: Record workflow status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_REPO: ${{ github.repository }}
          RUN_POINTER_PATH: docs/data/freight-truck-stock-status.json
          RUN_WORKFLOW_NAME: Update freight registered trucks
        run: python3 scripts/publish_nvdb_run_status.py
