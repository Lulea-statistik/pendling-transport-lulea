name: Update NVDB statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "47 5 * * 1"
  push:
    paths:
      - "scripts/fetch_nvdb_data.py"
      - ".github/workflows/update-nvdb-data.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Fetch NVDB municipal statistics
        run: python scripts/fetch_nvdb_data.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nvdb.json docs/data/nvdb.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update NVDB municipal statistics"
            git push
          fi
