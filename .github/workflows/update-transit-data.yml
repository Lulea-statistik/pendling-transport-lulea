name: Update public transport data

on:
  workflow_dispatch:
  schedule:
    - cron: "12 6 * * *"
  push:
    paths:
      - "scripts/fetch_transit_gtfs.py"
      - ".github/workflows/update-transit-data.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TRAFIKLAB_API_KEY: ${{ secrets.TRAFIKLAB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Lulea public transport dataset
        run: python scripts/fetch_transit_gtfs.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/transit.json docs/data/transit.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Lulea public transport data"
            git pull --rebase origin main
            git push
          fi
