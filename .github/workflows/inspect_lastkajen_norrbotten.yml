name: Inspect Lastkajen Norrbotten
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Norrbotten NVDB GeoPackage
        env:
          LASTKAJEN_USERNAME: ${{ secrets.LASTKAJEN_USERNAME }}
          LASTKAJEN_PASSWORD: ${{ secrets.LASTKAJEN_PASSWORD }}
        run: python3 scripts/inspect_lastkajen_norrbotten.py
      - name: Upload schema metadata only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lastkajen-schema-norrbotten
          path: lastkajen_schema.json
          retention-days: 3
