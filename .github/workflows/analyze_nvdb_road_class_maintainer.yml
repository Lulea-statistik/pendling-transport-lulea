name: Analyze NVDB road class by maintainer
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/analyze_nvdb_road_class_maintainer.py
      - scripts/publish_road_class_maintainer.py
      - .github/workflows/analyze_nvdb_road_class_maintainer.yml
permissions:
  contents: write
concurrency:
  group: nvdb-road-class-maintainer
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install GIS tools
        run: python3 -m pip install requests shapely pyproj
      - name: Intersect functional road classes with road maintainers
        env:
          LASTKAJEN_USERNAME: ${{ secrets.LASTKAJEN_USERNAME }}
          LASTKAJEN_PASSWORD: ${{ secrets.LASTKAJEN_PASSWORD }}
        run: python3 scripts/analyze_nvdb_road_class_maintainer.py
      - name: Upload diagnostic only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nvdb-road-class-maintainer-qa
          path: nvdb_output/nvdb_road_class_maintainer_qa.json
          retention-days: 7
      - name: Validate and publish website data
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish_road_class_maintainer.py
          python3 - <<'PY'
          import base64,json,os,urllib.request,urllib.error
          path="docs/data/nvdb-road-class-maintainer.json"
          api="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/contents/"+path
          token=os.environ["GH_TOKEN"]
          headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","Content-Type":"application/json"}
          content=open(path,"rb").read()
          for attempt in range(4):
              try:
                  with urllib.request.urlopen(urllib.request.Request(api,headers=headers),timeout=30) as r:
                      current=json.load(r);sha=current["sha"]
              except urllib.error.HTTPError as e:
                  if e.code!=404:raise
                  sha=None
              payload={"message":"Update validated NVDB road class x maintainer data","content":base64.b64encode(content).decode()}
              if sha:payload["sha"]=sha
              try:
                  with urllib.request.urlopen(urllib.request.Request(api,method="PUT",headers=headers,data=json.dumps(payload).encode()),timeout=30) as r:
                      print("Published validated road structure",r.status)
                  break
              except urllib.error.HTTPError as e:
                  if e.code not in (409,422) or attempt==3:raise
          PY
      - name: Save status for automatic discovery
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_REPO: ${{ github.repository }}
          RUN_POINTER_PATH: docs/data/nvdb-road-class-maintainer-status.json
          RUN_WORKFLOW_NAME: Analyze NVDB road class by maintainer
        run: python3 scripts/publish_nvdb_run_status.py
