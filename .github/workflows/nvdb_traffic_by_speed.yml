name: NVDB traffic by speed
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build_nvdb_traffic_by_speed.py
      - .github/workflows/nvdb_traffic_by_speed.yml
permissions:
  contents: write
concurrency:
  group: nvdb-traffic-by-speed
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install GIS libraries
        run: python3 -m pip install requests shapely pyproj
      - name: Spatially join NVDB traffic and speed
        env:
          LASTKAJEN_USERNAME: ${{ secrets.LASTKAJEN_USERNAME }}
          LASTKAJEN_PASSWORD: ${{ secrets.LASTKAJEN_PASSWORD }}
        run: python3 scripts/build_nvdb_traffic_by_speed.py
      - name: Upload QA data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nvdb-traffic-by-speed-diagnostics
          path: nvdb_output/traffic_by_speed_diagnostics.json
          retention-days: 7
      - name: Record run pointer
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_REPO: ${{ github.repository }}
          RUN_POINTER_PATH: docs/data/nvdb-traffic-by-speed-status.json
          RUN_WORKFLOW_NAME: NVDB traffic by speed
        run: python3 scripts/publish_nvdb_run_status.py
